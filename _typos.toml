# typos spell checker configuration
# https://github.com/crate-ci/typos

[default]
extend-ignore-re = [
  # Keep opaque trace IDs and abbreviated commit hashes out of the word checker.
  "(?i)(?:^|[^A-Za-z0-9])[0-9a-f]{7,64}(?:$|[^A-Za-z0-9])",
  # Preserve the exact truncated fixture value and technical operation phrase.
  'want: "hel", wantCell',
  "approval: restat trust store",
  # ERROR is an established status token in pluralized historical notes.
  "(?i)\\bERRORs?\\b",
  # These are clipped strings from preserved PTY/network evidence.
  "PTY cancel queu",
  "PTY cancel activ",
  "R8 activ",
  "run retur\\.\\.\\.",
  # This exact synthetic PTY frame intentionally starts mid-word.
  "afe-review-row-0123456789-safe-review-row-0123456789-safe-review-row-012345678",
  # Short commit IDs in historical source-to-main mappings.
  "4ba→8a9101c",
  "ba01→778eec5",
]

[default.extend-identifiers]
# Short variable names in Go code that trigger false positives
typ = "typ"
ue = "ue"

[default.extend-words]
# Valid variant used in provider documentation.
unparseable = "unparseable"
