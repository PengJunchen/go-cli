name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.24"

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - run: go mod download

      - run: go build ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Check formatting (gofmt + goimports)
        run: |
          gofmt -s -l .
          goimports -l .
          test -z "$(gofmt -s -l .)" && test -z "$(goimports -l .)"

      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - run: go mod download

      - run: go test -race -count=1 -coverprofile=coverage.out ./...

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: coverage
          path: coverage.out

  coverage:
    name: Coverage Threshold (>=65%)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - run: go mod download

      - name: Check coverage >= 65%
        run: make test-cov-check

  scan:
    name: AST Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - run: go mod download

      - name: Run AST scanner (JSON format)
        run: |
          output=$(go run ./internal/verify/cmd/scanner -dir ./internal -format json)
          echo "$output"
          if echo "$output" | grep -q '"severity":"ERROR"'; then
            echo "::error::AST scan found ERROR-level findings"
            exit 1
          fi
          echo "AST scan passed: no ERROR-level findings"

  test-log:
    name: Log Verification Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - run: go mod download

      - name: Run log-based verification tests
        run: make test-log

  test-leak:
    name: Goroutine Leak Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - run: go mod download

      - name: Run goroutine leak tests
        run: make test-leak
