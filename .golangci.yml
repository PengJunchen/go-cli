version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

output:
  formats:
    text:
      path: stdout
      colors: true
      print-linter-name: true
      print-issued-lines: true

linters:
  enable:
    - govet
    - errcheck
    - revive
    - misspell
    - gosec
    - ineffassign
    - unused
    - staticcheck
  settings:
    govet:
      enable-all: true
      disable:
        - stdmethods
        - fieldalignment
        - shadow
    errcheck:
      check-type-assertions: true
      check-blank: false
    revive:
      confidence: 0.8
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: var-naming
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
    gosec:
      excludes:
        - G115
        - G112
        - G104
        - G101
        - G107
        - G204
        - G301
        - G302
        - G306
        - G402
        - G404
        - G602
        - G702
        - G703
        - G710
        - G122
    misspell:
      locale: US
    staticcheck:
      checks:
        - all
        - -QF*
  exclusions:
    presets:
      - common-false-positives
    paths:
      - ".*\\.mock\\.go$"
      - ".*\\.pb\\.go$"
    rules:
      - path: _test\.go
        linters:
          - unused
          - errcheck
          - staticcheck
          - ineffassign
          - misspell
          - govet
      - path: tests/.*
        linters:
          - errcheck
          - staticcheck
          - ineffassign
          - misspell
          - govet

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/pengjunchen/go-cli

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
