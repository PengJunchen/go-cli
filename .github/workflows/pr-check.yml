name: PR Check

on:
  pull_request:

env:
  GO_VERSION: "1.23"

permissions:
  contents: read

jobs:
  compliant:
    name: Compliant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - run: go mod download

      - name: Check spelling
        uses: crate-ci/typos@v1.32.0

      - name: Check go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check gofmt
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "Files not formatted:"
            echo "$output"
            exit 1
          fi

      - name: Check goimports
        run: |
          go install golang.org/x/tools/cmd/goimports@latest
          output=$(goimports -l .)
          if [ -n "$output" ]; then
            echo "Files with incorrect imports:"
            echo "$output"
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

      - name: Run tests
        run: go test -race -count=1 ./...
